[project]
name = "ppa"
version = "0.1.0"
description = "Valuation and risk for German solar and wind PPAs from public data."
requires-python = ">=3.11"
dependencies = [
  "holidays>=0.50",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "requests>=2.31",
  "scipy>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ppa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
